<script>
// Fit pass: every [data-fit][data-max] steps down 2 px at a time (floor data-min) until its box stops
// overflowing. Whatever still overflows (or any [data-fit] box) makes render-card exit 2: shorten the copy.
window.cardReady = (async () => {
  await document.fonts.ready;
  S25.prep();
  const over = (el) => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1;
  for (const el of document.querySelectorAll('[data-fit][data-max]')) {
    let px = +el.dataset.max;
    const min = +el.dataset.min;
    el.style.fontSize = px + 'px';
    while (over(el) && px > min) { px -= 2; el.style.fontSize = px + 'px'; }
  }
})();
</script>
