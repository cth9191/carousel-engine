<svg class="traces" viewBox="0 0 1080 1350" aria-hidden="true">
  <path class="tr" d="M1080 548 H870 a18 18 0 0 0 -18 18 V700"/><circle class="node" cx="852" cy="700" r="5"/>
  <path class="tr" d="M0 880 H32 a18 18 0 0 1 18 18 V1020"/><circle class="node" cx="50" cy="1020" r="5"/>
</svg>
<div class="main" data-fit>
  <div class="kickrow"><span class="kicker">Install</span><span class="pill">Step 01</span></div>
  <h1 class="hl" data-fit data-max="112" data-min="96">Install it with one command</h1>
  <p class="body" data-fit data-max="32" data-min="30">You need Node.js 18 or newer. One npm install puts the <b>claude</b> command on macOS, Windows or Linux.</p>
  <div class="modzone">
    <div class="shell">
      <div class="term">
        <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="cp"><i data-lucide="copy"></i></span></div>
        <pre><span class="p">$</span> npm install -g @anthropic-ai/claude-code
<span class="p">$</span> cd my-project
<span class="p">$</span> claude --version
<span class="ok">2.1.296 (Claude Code)</span></pre>
      </div>
    </div>
  </div>
</div>
<div class="foot">
  <span class="chip"><span class="ic"><i data-lucide="laptop"></i></span>macOS</span>
  <span class="chip"><span class="ic"><i data-lucide="monitor"></i></span>Windows</span>
  <span class="chip"><span class="ic"><i data-lucide="server"></i></span>Linux</span>
</div>
<script>
// Fit pass: every [data-fit][data-max] steps down 2 px at a time (floor data-min) until its box stops
// overflowing. Whatever still overflows (or any [data-fit] box) makes render-card exit 2: shorten the copy.
window.cardReady = (async () => {
  await document.fonts.ready;
  S25.prep();
  const over = (el) => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1;
  for (const el of document.querySelectorAll('[data-fit][data-max]')) {
    let px = +el.dataset.max;
    const min = +el.dataset.min;
    el.style.fontSize = px + 'px';
    while (over(el) && px > min) { px -= 2; el.style.fontSize = px + 'px'; }
  }
})();
</script>
</body>
