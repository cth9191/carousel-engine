<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">

</head>
<body>
<div class="hdr"><img src="../logos/avatar.png" alt=""><span>{{BRAND}}</span></div>
<div class="count">02 / 10</div>
<svg class="traces" viewBox="0 0 1080 1350" aria-hidden="true">
  <path class="tr" d="M1080 548 H870 a18 18 0 0 0 -18 18 V700"/><circle class="node" cx="852" cy="700" r="5"/>
  <path class="tr" d="M0 880 H32 a18 18 0 0 1 18 18 V1020"/><circle class="node" cx="50" cy="1020" r="5"/>
</svg>
<div class="main" data-fit>
  <div class="kickrow"><span class="kicker">What it is</span></div>
  <h1 class="hl" data-fit data-max="112" data-min="96">What is Claude Code?</h1>
  <p class="body" data-fit data-max="32" data-min="30">Pasting code into a chat breaks the moment a project grows. Claude Code is a coding agent that reads your repo, runs commands and edits real files.</p>
  <div class="modzone">
    <div class="capture" style="width:840px; height:380px">
      <img class="shot" src="../shots/capture-a.png" alt="">
      <div class="stat"><span class="glyph"><i data-lucide="terminal"></i></span><span class="num">1</span><span class="lab">command to install</span></div>
    </div>
  </div>
</div>
<div class="foot">
  <span class="chip"><span class="ic"><i data-lucide="download"></i></span>Install</span>
  <span class="chip"><span class="ic"><i data-lucide="plug"></i></span>Connect</span>
  <span class="chip"><span class="ic"><i data-lucide="play"></i></span>Run</span>
</div>
<script>
// Fit pass: every [data-fit][data-max] steps down 2 px at a time (floor data-min) until its box stops
// overflowing. Whatever still overflows (or any [data-fit] box) makes render-card exit 2: shorten the copy.
window.cardReady = (async () => {
  await document.fonts.ready;
  S25.prep();
  const over = (el) => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1;
  for (const el of document.querySelectorAll('[data-fit][data-max]')) {
    let px = +el.dataset.max;
    const min = +el.dataset.min;
    el.style.fontSize = px + 'px';
    while (over(el) && px > min) { px -= 2; el.style.fontSize = px + 'px'; }
  }
})();
</script>
</body>
