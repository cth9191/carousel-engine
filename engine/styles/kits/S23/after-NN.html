<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S23 After Face</title>
<!--
  S23 Crop-Mark Proof Sheet: the AFTER face of a before/after stack (the sheet-white stack's front sheet).
  Copy to $D/cards/after-NN.html (NN = slide) and edit only the JSON in <script id="data">.

    tag      small orange mono caps label, default "AFTER"
    command  the exact typeable form, lowercase, as typed ("/simplify"; a plugin or MCP server by its bare
             name). 22 characters or fewer. This tag line is where the slide's exact command lives.
    title    Anton caps, 14 characters or fewer (46 px, fits down to 30 px)
    mono     true = code / terminal text (30 characters a line, 8 lines, or 6 in the 1.25:1 zone); false = prose (28 words max)
    lines    the real "after" text from the same run as the before face

  Sheet-white #FBF8F3 face with a thin ink outline. Render at the zone's --zones-only out bbox x2
  (about 364x331, or 364x291 under a two-line headline):
    node shared/render-card.mjs $D/cards/after-04.html $D/cards/after-04.png --w 364 --h 331 --scale 2
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<script id="data" type="application/json">
{
  "tag": "AFTER",
  "command": "/simplify",
  "title": "One chain",
  "mono": true,
  "lines": [
    "return rows",
    "  .filter((r) => r.paid)",
    "  .map((r) => r.email);"
  ]
}
</script>
</head>
<body>
<script src="kit.js"></script>
<script>
KIT.ready((d) => {
  KIT.limit(String(d.title).length <= 14, 'title-over-14-chars');
  KIT.limit(String(d.command).length <= 22, 'command-over-22-chars');
  KIT.limit(d.command === String(d.command).toLowerCase(), 'command-not-lowercase');
  if (d.mono) KIT.limit(d.lines.length <= (innerHeight >= 320 ? 8 : 6), 'code-over-8-lines-or-6-under-a-two-line-headline');
  else KIT.limit(KIT.words(d.lines.join(' ')) <= 28, 'lines-over-28-words');
  const body = d.mono ? KIT.esc(d.lines.join('\n')) : d.lines.map((l) => `<p>${KIT.esc(l)}</p>`).join('');
  document.body.insertAdjacentHTML('beforeend', `
    <div class="card after">
      <span class="tag" data-fit>${KIT.esc(d.tag || 'AFTER')}<span class="cmd">${KIT.esc(d.command)}</span></span>
      <div class="ttl" data-fit data-min="30">${KIT.esc(d.title)}</div>
      <div class="rule"></div>
      <div class="lines${d.mono ? ' mono' : ''}" data-fit>${body}</div>
    </div>`);
});
</script>
</body>
</html>
