<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S23 Before Face</title>
<!--
  S23 Crop-Mark Proof Sheet: the BEFORE face of a before/after stack (the ink stack's front sheet).
  Copy to $D/cards/before-NN.html (NN = slide) and edit only the JSON in <script id="data">.

    tag    small orange mono caps label, default "BEFORE"
    title  Anton caps, 14 characters or fewer (46 px, fits down to 30 px)
    mono   true = lines are code / terminal text (JetBrains Mono, whitespace kept, 30 characters a line, 8 lines, or 6 in the 1.25:1 zone)
           false = lines are prose paragraphs (Inter 500, 28 words max in all)
    lines  the real "before" text from the run (spines.md: never an illustrative mock)

  Ink #0E0E0E face, cream text, faint halftone stipple in the lower-left corner. Render at the zone's
  --zones-only out bbox x2 (one-line headline: about 364x331, 1.1:1; two-line: about 364x291, 1.25:1):
    node shared/render-card.mjs $D/cards/before-04.html $D/cards/before-04.png --w 364 --h 331 --scale 2
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<script id="data" type="application/json">
{
  "tag": "BEFORE",
  "title": "Nested",
  "mono": true,
  "lines": [
    "const paid = [];",
    "for (const r of rows) {",
    "  if (r.paid === true) {",
    "    paid.push(r.email);",
    "  }",
    "}",
    "return paid;"
  ]
}
</script>
</head>
<body>
<script src="kit.js"></script>
<script>
KIT.ready((d) => {
  KIT.limit(String(d.title).length <= 14, 'title-over-14-chars');
  if (d.mono) KIT.limit(d.lines.length <= (innerHeight >= 320 ? 8 : 6), 'code-over-8-lines-or-6-under-a-two-line-headline');
  else KIT.limit(KIT.words(d.lines.join(' ')) <= 28, 'lines-over-28-words');
  const body = d.mono ? KIT.esc(d.lines.join('\n')) : d.lines.map((l) => `<p>${KIT.esc(l)}</p>`).join('');
  document.body.insertAdjacentHTML('beforeend', `
    <div class="card before">
      <div class="stipple"></div>
      <span class="tag">${KIT.esc(d.tag || 'BEFORE')}</span>
      <div class="ttl" data-fit data-min="30">${KIT.esc(d.title)}</div>
      <div class="rule"></div>
      <div class="lines${d.mono ? ' mono' : ''}" data-fit>${body}</div>
    </div>`);
});
</script>
</body>
</html>
