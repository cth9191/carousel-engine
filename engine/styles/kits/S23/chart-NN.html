<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S23 Two-Tone Chart</title>
<!--
  S23 Crop-Mark Proof Sheet: the chart face of a chart + audit slide (the sheet-white magenta zone on the left).
  Two lines from ONE real run: orange = with the skill (good), ink = without (bad), each ending in a pill label.
  The chart's title is painted on the plate above the sheet ("{chart label}"), so the card carries none.
  Copy to $D/cards/chart-NN.html and edit only the JSON in <script id="data">.

    yTicks, yUnit   y gridline values and the unit appended to each label ("%", "K", "s", or "")
    xTicks, xTitle  x tick values and the axis title (18 characters or fewer, mono caps)
    good, bad       { label (pill, 14 characters or fewer), points [[x, y], ...] } from the saved run
                    (evidence.source); never an illustrative curve

  Render at the zone's --zones-only out bbox x2 (about 484x400):
    node shared/render-card.mjs $D/cards/chart-05.html $D/cards/chart-05.png --w 484 --h 400 --scale 2
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<script id="data" type="application/json">
{
  "yTicks": [0, 25, 50, 75, 100],
  "yUnit": "%",
  "xTicks": [0, 10, 20, 30, 40],
  "xTitle": "TURNS",
  "good": { "label": "with skill", "points": [[0, 6], [5, 13], [10, 19], [15, 23], [20, 26], [25, 28], [30, 30], [35, 31], [40, 32]] },
  "bad":  { "label": "without",    "points": [[0, 6], [5, 21], [10, 37], [15, 51], [20, 64], [25, 76], [30, 87], [35, 95], [40, 99]] }
}
</script>
</head>
<body>
<script src="kit.js"></script>
<script>
// Catmull-Rom through the points, as cubic Bezier segments (no overshoot past neighbours at tension 0.5).
function smooth(pts) {
  if (pts.length < 3) return 'M' + pts.map((p) => p.join(',')).join(' L');
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1.join(',')} ${c2.join(',')} ${p2.join(',')}`;
  }
  return d;
}
KIT.ready((d) => {
  KIT.limit(String(d.xTitle).length <= 18, 'xTitle-over-18-chars');
  KIT.limit(d.good.label.length <= 14 && d.bad.label.length <= 14, 'pill-over-14-chars');
  const W = innerWidth, H = innerHeight;
  const L = 62, R = 22, T = 24, B = 62;              // plot box inside the 1.5 px outline
  const x0 = d.xTicks[0], x1 = d.xTicks[d.xTicks.length - 1];
  const y0 = d.yTicks[0], y1 = d.yTicks[d.yTicks.length - 1];
  const X = (v) => L + (v - x0) / (x1 - x0) * (W - L - R);
  const Y = (v) => H - B - (v - y0) / (y1 - y0) * (H - T - B);
  const P = (s) => s.points.map(([a, b]) => [+X(a).toFixed(1), +Y(b).toFixed(1)]);
  const grid = d.yTicks.map((v) => `
      <line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(14,14,14,${v === y0 ? .55 : .14})" stroke-width="${v === y0 ? 1.6 : 1}" ${v === y0 ? '' : 'stroke-dasharray="4 5"'}/>
      <text class="tick" x="${L - 10}" y="${Y(v) + 5}" text-anchor="end">${v}${KIT.esc(d.yUnit || '')}</text>`).join('');
  const xt = d.xTicks.map((v) => `
      <line x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H - B}" stroke="rgba(14,14,14,${v === x0 ? .55 : .1})" stroke-width="${v === x0 ? 1.6 : 1}" ${v === x0 ? '' : 'stroke-dasharray="4 5"'}/>
      <text class="tick" x="${X(v)}" y="${H - B + 22}" text-anchor="middle">${v}</text>`).join('');
  const g = P(d.good), b = P(d.bad);
  document.body.insertAdjacentHTML('beforeend', `
    <div class="chart">
      <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
        ${grid}${xt}
        <text class="axis-title" x="${L + (W - L - R) / 2}" y="${H - 14}" text-anchor="middle">${KIT.esc(d.xTitle)}</text>
        <path id="lb" d="${smooth(b)}" fill="none" stroke="#0E0E0E" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="lg" d="${smooth(g)}" fill="none" stroke="#D9551F" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="pill good" id="pg">${KIT.esc(d.good.label)}</span>
      <span class="pill bad" id="pb">${KIT.esc(d.bad.label)}</span>
    </div>`);
  // Each pill goes at its own line's end: try above / below the end point, sliding left in 12 px steps,
  // and take the first spot that touches neither line, the other pill or the plot edge.
  const sample = (id) => { const p = document.getElementById(id), n = p.getTotalLength(), out = [];
    for (let i = 0; i <= 160; i++) { const q = p.getPointAtLength(n * i / 160); out.push([q.x, q.y]); } return out; };
  const curves = [...sample('lg'), ...sample('lb')];
  const placed = [];
  const hits = (x, y, w, h) => curves.some(([cx, cy]) => cx > x - 7 && cx < x + w + 7 && cy > y - 7 && cy < y + h + 7) ||
    placed.some((r) => x < r[0] + r[2] + 6 && x + w + 6 > r[0] && y < r[1] + r[3] + 6 && y + h + 6 > r[1]);
  for (const [el, pts] of [[document.getElementById('pg'), g], [document.getElementById('pb'), b]]) {
    const w = el.offsetWidth, h = el.offsetHeight, end = pts[pts.length - 1];
    let best = null;
    for (let dx = 0; dx <= W - L - R - w && !best; dx += 12) {
      const x = W - R - 2 - w - dx;
      for (const y of [end[1] - h - 12, end[1] + 12]) {
        if (y < T - 4 || y + h > H - B - 4) continue;
        if (!hits(x, y, w, h)) { best = [x, y]; break; }
      }
    }
    KIT.limit(!!best, 'no-room-for-pill');
    if (!best) continue;
    placed.push([best[0], best[1], w, h]);
    el.style.left = best[0] + 'px';
    el.style.top = best[1] + 'px';
  }
});
</script>
</body>
</html>
