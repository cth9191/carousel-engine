<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S26 cover card</title>
<!--
  S26 Whiteboard Doodle Showcase, cover card. Cover title zone x 80-1000, y 64-830 = 920 x 766.
    node shared/render-card.mjs cards/cover.html cards/cover.png --w 920 --h 766 --scale 2 --bg "#FBF8F3"
  --bg = the plate ground sampled beside the zone (#FBF8F3 on a clean plate). Use the plate's measured
  --zones-only out bbox for --w/--h. Paste: python -I shared/composite.py plate out --card MN=cards/cover.png
  Edit only the JSON below. Fields: lines (the hook, 2-3 lines, from engine/hooks.md); key = index of the line that gets the orange underline; aside = the verified star figure or month; counter optional.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@500;800&display=block" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
</head>
<body data-card="cover">
<script id="data" type="application/json">
{
  "lines": [
    "7 Claude Code skills",
    "that kill AI slop",
    "in your designs"
  ],
  "key": 1,
  "aside": "(stars checked on posting day)"
}
</script>
<script src="kit.js"></script>
</body>
</html>
