<title>S26 head card</title>
<!--
  S26 Whiteboard Doodle Showcase, head card. Item head zone x 80-1000, y 64-330 = 920 x 266.
    node shared/render-card.mjs cards/head-NN.html cards/head-NN.png --w 920 --h 266 --scale 2 --bg "#FBF8F3"
  --bg = the plate ground sampled beside the zone (#FBF8F3 on a clean plate). Use the plate's measured
  --zones-only out bbox for --w/--h. Paste: python -I shared/composite.py plate out --card MN=cards/head-NN.png
  Edit only the JSON below. Fields: counter "NN / TT"; name = the item's exact name in real case (one line 120->64 px, else two lines).
-->
