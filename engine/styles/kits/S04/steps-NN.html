<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S04 Steps Card</title>
<!--
  S04 Brutalist Mascot Poster: numbered steps. For start / step slides: install, first
  command, the 2-4 moves in order. Copy to $D/cards/steps-NN.html (NN = slide), edit only the JSON.

    steps   2-4 strings, 52 characters or fewer each. Wrap an exact command in backticks (`/plugin`) to set it
            in JetBrains Mono; the command must match the source verbatim.
    frame   true (default) = sheet-white face with the ink outline; false = no face, rows sit on transparent

  Render without --bg at the zone's --zones-only out bbox x2 (sample: 914x300), paste with --card N=… --ground fill:
    node shared/render-card.mjs $D/cards/steps-09.html $D/cards/steps-09.png --w 914 --h 300 --scale 2 --min-px 22
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700;800;900&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<script id="data" type="application/json">
{
  "frame": true,
  "steps": [
    "Open the notes app you already use.",
    "Turn on backlinks in `Settings › Links`.",
    "Link one new note to an old one today."
  ]
}
</script>
</head>
<body>
<script src="kit.js"></script>
<script>
KIT.ready((d) => {
  const steps = d.steps || [];
  KIT.limit(steps.length >= 2 && steps.length <= 4, 'steps-not-2-to-4');
  KIT.limit(steps.every((s) => s.replace(/`/g, '').length <= 52), 'step-over-52-chars');
  const fmt = (s) => KIT.esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
  document.body.insertAdjacentHTML('beforeend', `
    <div class="${d.frame === false ? '' : 'face '}stp" style="position:absolute;inset:0">${steps.map((s, i) => `
      <div class="s"><span class="n">${i + 1}.</span><div class="t" data-fit data-min="26" style="max-height:2.4em;overflow:hidden">${fmt(s)}</div></div>`).join('')}
    </div>`);
});
</script>
</body>
</html>
