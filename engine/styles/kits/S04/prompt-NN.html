<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S04 Prompt Card</title>
<!--
  S04 Brutalist Mascot Poster: the copy-paste card. For peak / start slides: a prompt,
  command or config, verbatim. Copy to $D/cards/prompt-NN.html (NN = slide), edit only the JSON.

    label   orange mono tab, 30 characters or fewer, e.g. "PASTE THIS INTO CLAUDE CODE"
    face    "paper" (sheet white, ink outline) for a prose prompt; "ink" for a command or config
    mono    false = prose prompt, Inter ExtraBold, 40 words or fewer
            true  = command / config, JetBrains Mono, whitespace kept, 8 lines or fewer, 40 characters a line;
                    a line starting "$ " or "> " gets an orange prompt mark
    text    the exact text from the source (README, SKILL.md, the run): never paraphrased

  Render without --bg at the zone's --zones-only out bbox x2 (sample: 914x398), paste with --card N=… --ground fill:
    node shared/render-card.mjs $D/cards/prompt-07.html $D/cards/prompt-07.png --w 914 --h 398 --scale 2 --min-px 22
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700;800;900&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<script id="data" type="application/json">
{
  "label": "PASTE THIS INTO YOUR NOTES APP",
  "face": "paper",
  "mono": false,
  "text": "Read my last ten notes. Find the three ideas I keep coming back to, then link each note to the idea it supports."
}
</script>
</head>
<body>
<script src="kit.js"></script>
<script>
KIT.ready((d) => {
  KIT.limit(String(d.label || '').length <= 30, 'label-over-30-chars');
  const lines = String(d.text).split('\n');
  if (d.mono) {
    KIT.limit(lines.length <= 8, 'mono-over-8-lines');
    KIT.limit(lines.every((l) => l.length <= 40), 'mono-line-over-40-chars');
  } else {
    KIT.limit(KIT.words(d.text) <= 40, 'prose-over-40-words');
  }
  const body = d.mono
    ? lines.map((l) => /^[$>] /.test(l) ? `<span class="pr">${KIT.esc(l[0])}</span>${KIT.esc(l.slice(1))}` : KIT.esc(l)).join('\n')
    : KIT.esc(d.text);
  document.body.insertAdjacentHTML('beforeend', `
    <div class="face${d.face === 'ink' ? ' ink' : ''}">
      <div class="prm" style="position:absolute;inset:0">
        ${d.label ? `<span class="lbl">${KIT.esc(d.label)}</span>` : ''}
        <div class="txt${d.mono ? ' mono' : ''}" data-fit data-min="${d.mono ? 22 : 28}">${body}</div>
      </div>
    </div>`);
});
</script>
</body>
</html>
