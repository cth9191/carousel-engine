<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S04 Cover Chip Patch</title>
<!--
  S04 Brutalist Mascot Poster: one cover tag tile, used ONLY to patch a chip the cover plate misspelled.
  Copy to $D/cards/chip-<n>.html, edit only the JSON, render at the painted chip's box in final pixels (x2), then
  paste it over the bad chip:
    node shared/render-card.mjs $D/cards/chip-2.html $D/cards/chip-2.png --w 150 --h 66 --scale 2 --min-px 22
    python -I shared/composite.py $D/final/slide-01.png $D/final/slide-01.png --paste $D/cards/chip-2.png@x,y,150,66,erase

    text    the chip's exact token from strings[], 6 characters or fewer ("/goal", ".md", "1M", "MCP")
    color   "orange" or "ink" (the painted chip's colour)
    tilt    degrees, the painted chip's tilt (-8 to 8)

  The patch is flat (no relief); keep its box tight to the painted chip so the erase covers the old one.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<script id="data" type="application/json">
{ "text": "/link", "color": "orange", "tilt": -5 }
</script>
</head>
<body>
<script src="kit.js"></script>
<script>
KIT.ready((d) => {
  KIT.limit(String(d.text).length <= 6, 'chip-over-6-chars');
  const t = Math.max(-8, Math.min(8, +d.tilt || 0));
  const rad = Math.abs(t) * Math.PI / 180;
  // shrink the tile so its rotated corners stay inside the box
  const k = 1 / (Math.cos(rad) + Math.sin(rad) * Math.max(innerWidth / innerHeight, innerHeight / innerWidth));
  document.body.insertAdjacentHTML('beforeend',
    `<div class="chip ${d.color === 'ink' ? 'ink' : 'orange'}" style="transform:rotate(${t}deg) scale(${k.toFixed(3)})"><span data-fit data-min="22" style="display:block;max-width:90%;overflow:hidden">${KIT.esc(d.text)}</span></div>`);
});
</script>
</body>
</html>
