<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S05 caption overlay</title>
<!--
  S05 Phone-Photo Monitor: the caption stickers over one finished photo (plate with the real capture already
  warped onto its screen). Copy to $D/cards/slide-NN.html, edit only the JSON, render full frame:
    node shared/render-card.mjs $D/cards/slide-NN.html $D/final/slide-NN.png --w 1080 --h 1350 --scale 1 --min-px 30
  "plate" is relative to this file (default ../fitted/slide-NN.png, this file's own name).
  Sticker roles: title (the item line or cover hook), body (one plain sentence or two), link (owner/repo or a URL).
  Each line gets its own white box hugging the text, TikTok-native. Limits: at most 3 stickers; title <= 12 words,
  body <= 34 words, link <= 48 characters, no sticker over the phone-photo's screen centre unless "y" says so.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; }
  body { position: relative; background: #111 center / cover no-repeat; font-family: 'Inter', sans-serif; }
  .sticker { position: absolute; left: 50%; transform: translateX(-50%); width: 92%; display: flex; flex-direction: column;
             overflow: hidden; text-align: center; }
  .sticker.top { justify-content: flex-start; } .sticker.mid { justify-content: center; } .sticker.bottom { justify-content: flex-end; }
  .sticker p { margin: 0; color: #0E0E0E; font-weight: 600; letter-spacing: -0.012em; line-height: 1.32; }
  .sticker p span { background: #fff; padding: 0.06em 0.3em 0.1em; border-radius: 0.2em;
                    -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .sticker.title p { font-size: 74px; font-weight: 600; }
  .sticker.body p { font-size: 52px; font-weight: 600; }
  .sticker.link p { font-size: 46px; font-weight: 600; letter-spacing: -0.005em; }
  .counter { position: absolute; right: 4.5%; bottom: 3.2%; background: #fff; color: #0E0E0E; font: 600 30px/1 'Inter', sans-serif;
             padding: 9px 14px 10px; border-radius: 8px; letter-spacing: 0.01em; }
</style>
</head>
<body>
<script type="application/json" id="data">
{
  "plate": "",
  "counter": "2/7",
  "stickers": [
    { "role": "title", "text": "1) Repo Name" },
    { "role": "body",  "text": "One plain sentence on what it does for you, then one on what it replaces." },
    { "role": "link",  "text": "github.com/owner/repo" }
  ]
}
</script>
<script src="kit.js"></script>
<script>
  // Default box per role: top edge (% of height), box height (%), and where the text sits inside it.
  const ROLE = {
    title:  { y: 12.5, h: 19, align: 'top',    max: 12, unit: 'words', min: 54 },
    body:   { y: 40,   h: 36, align: 'mid',    max: 34, unit: 'words', min: 40 },
    link:   { y: 82,   h: 9,  align: 'bottom', max: 48, unit: 'chars', min: 34 },
  };
  KIT.ready((d) => {
    let plate = d.plate;
    if (!plate) plate = '../fitted/' + location.pathname.split('/').pop().replace(/\.html$/, '.png');
    document.body.style.backgroundImage = `url("${plate}")`;
    const st = d.stickers || [];
    KIT.limit(st.length >= 1 && st.length <= 3, 'stickers-1-to-3');
    for (const s of st) {
      const r = ROLE[s.role];
      KIT.limit(!!r, 'unknown-role');
      if (!r) continue;
      const n = r.unit === 'words' ? KIT.words(s.text) : String(s.text).length;
      KIT.limit(n <= r.max, `${s.role}-over-${r.max}-${r.unit}`);
      const box = document.createElement('div');
      box.className = `sticker ${s.role} ${s.align || r.align}`;
      box.style.top = (s.y ?? r.y) + '%';
      box.style.height = (s.h ?? r.h) + '%';
      box.setAttribute('data-fit', '');
      box.dataset.min = r.min;
      box.innerHTML = `<p><span>${KIT.esc(s.text)}</span></p>`;
      // the fit pass shrinks the box's font-size; the <p> inherits it
      box.style.fontSize = getComputedStyle(document.body).fontSize;
      document.body.appendChild(box);
      const p = box.querySelector('p');
      box.style.fontSize = getComputedStyle(p).fontSize;
      p.style.fontSize = 'inherit';
    }
    if (d.counter) {
      const c = document.createElement('div');
      c.className = 'counter';
      c.textContent = d.counter;
      document.body.appendChild(c);
    }
    window.cardInfo = { plate, stickers: st.length };
  });
</script>
</body>
</html>
