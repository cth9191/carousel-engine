<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S24 Verdict Table</title>
<!--
  S24 Spotlight Dossier: the verdict table (your own take on each item, from real use), the magenta panel on the
  optional Verdict slide. Copy to $D/cards/verdict.html and edit only the JSON in <script id="data">.

    label  orange tracked caps row, your own words, 40 characters or fewer (never a reference deck's label)
    rows   3-6 rows: { name (real case, 18 characters or fewer), verdict (24 characters or fewer, your own words),
           logo (optional: a tile PNG path relative to this file, e.g. "../logos/playwright.png", shown on a
           #FBF8F3 tile; use it for every row or none) }

  Render at the zone's --zones-only out bbox x2 (about 864x560):
    node shared/render-card.mjs $D/cards/verdict.html $D/cards/verdict.png --w 864 --h 560 --scale 2 --bg "#121212"
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<script id="data" type="application/json">
{
  "label": "where i landed · after a week",
  "rows": [
    { "name": "playwright-mcp", "verdict": "install today" },
    { "name": "context7", "verdict": "install today" },
    { "name": "serena", "verdict": "big repos only" },
    { "name": "task-master", "verdict": "try on a side project" },
    { "name": "claude-flow", "verdict": "wait for the next major" }
  ]
}
</script>
</head>
<body>
<script src="kit.js"></script>
<script>
KIT.ready((d) => {
  KIT.limit(String(d.label).length <= 40, 'label-over-40-chars');
  KIT.limit(d.rows.length >= 3 && d.rows.length <= 6, 'rows-not-3-to-6');
  KIT.limit(d.rows.every((r) => String(r.name).length <= 18), 'name-over-18-chars');
  KIT.limit(d.rows.every((r) => String(r.verdict).length <= 24), 'verdict-over-24-chars');
  const logos = d.rows.filter((r) => r.logo).length;
  KIT.limit(logos === 0 || logos === d.rows.length, 'logo-on-some-rows-only');
  document.body.insertAdjacentHTML('beforeend', `
    <div class="panel verdict">
      <div class="label" data-fit>${KIT.esc(d.label)}</div>
      <div class="rows">${d.rows.map((r) => `
        <div class="r"><div class="n" data-fit data-min="18">${r.logo ? `<img src="${KIT.esc(r.logo)}" alt="">` : ''}<span>${KIT.esc(r.name)}</span></div><div class="t" data-fit data-min="17">${KIT.esc(r.verdict)}</div></div>`).join('')}
      </div>
    </div>`);
  return Promise.all([...document.images].map((i) => i.decode().catch(() => KIT.limit(false, 'logo-did-not-load'))));
});
</script>
</body>
</html>
