<!DOCTYPE html>
<!-- Illustrative mock, not a real product screenshot: an optional reference composition for shared/render-heroes.mjs, not used by /carousel. A mock explains; it is never proof. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hero — step2 screenshots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1600px; height: 1000px;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    width: 1600px; height: 1000px;
    position: relative;
    background:
      radial-gradient(circle at 18% 20%, rgba(217,119,87,0.14), transparent 50%),
      linear-gradient(155deg, #231611 0%, #170f0b 100%);
    overflow: hidden;
  }
  /* Chat panel right */
  .chat {
    position: absolute;
    right: 80px; top: 70px;
    width: 640px; height: 860px;
    background: #F7F4EF;
    border-radius: 22px;
    box-shadow: 0 40px 90px rgba(0,0,0,0.5);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .ctop { height: 60px; background:#ECE6DC; border-bottom:1px solid rgba(14,14,14,0.08); display:flex; align-items:center; padding:0 20px; gap:11px;}
  .dot{width:18px;height:18px;border-radius:50%;}.r{background:#FF5F57;}.a{background:#FEBC2E;}.g{background:#28C840;}
  .ctitle{margin-left:18px; font-weight:700; font-size:18px; color:#5a5048; display:flex; align-items:center; gap:11px;}
  .logo-mark{width:24px;height:24px;border-radius:7px;background:#D97757;color:#fff;font-weight:900;font-size:15px;display:inline-flex;align-items:center;justify-content:center;}
  .cbody { flex:1; padding: 26px; display:flex; flex-direction:column; gap:18px; }
  .msg { max-width: 80%; padding: 15px 18px; border-radius: 16px; font-size:18px; font-weight:600; line-height:1.4;}
  .msg.bot { background:#fff; color:#3a322c; box-shadow:0 4px 14px rgba(0,0,0,0.06); border-top-left-radius:5px;}
  .msg.me { align-self:flex-end; background:#D97757; color:#fff; border-top-right-radius:5px;}
  .attach-row { align-self:flex-end; display:flex; gap:10px; }
  .mini { width:96px; height:72px; border-radius:10px; box-shadow:0 6px 14px rgba(0,0,0,0.18); }
  .m1{background:linear-gradient(150deg,#6C8AE4,#3D5AC9);}
  .m2{background:linear-gradient(150deg,#2EC4A6,#159C82);}
  /* input */
  .input { margin: 0 22px 22px; background:#fff; border-radius:16px; box-shadow: inset 0 0 0 1px rgba(14,14,14,0.08), 0 4px 14px rgba(0,0,0,0.05); padding: 16px 18px; }
  .ph { font-size:18px; color:#a89c8d; font-weight:600; }
  .input-bar { display:flex; align-items:center; justify-content:space-between; margin-top:16px;}
  .addimg { display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700; color:#D97757; background:rgba(217,119,87,0.12); padding:9px 14px; border-radius:999px;}
  .addimg b { font-size:20px; line-height:0; }
  .send { width:44px; height:44px; border-radius:12px; background:#D97757; display:flex; align-items:center; justify-content:center;}
  .send svg{width:20px;height:20px;fill:#fff;}
  /* drop zone over chat body */
  .dropzone {
    position:absolute; left: 30px; right: 30px; top: 470px; height: 190px;
    border: 3px dashed rgba(217,119,87,0.6);
    border-radius: 18px;
    background: rgba(217,119,87,0.06);
    display:flex; align-items:center; justify-content:center;
    z-index: 6;
  }
  .dz-lab { font-weight:800; font-size:18px; color:#c4724f; letter-spacing:.02em;}
  /* Screenshot thumbnails on left being dragged */
  .shot {
    position:absolute;
    border-radius: 14px;
    box-shadow: 0 26px 60px rgba(0,0,0,0.45), 0 4px 12px rgba(0,0,0,0.3);
    overflow:hidden;
    background:#fff;
  }
  .shot .sbar { height:26px; background:#ECE6DC; display:flex; align-items:center; padding:0 9px; gap:5px;}
  .shot .sbar i{width:8px;height:8px;border-radius:50%;}
  .shot .pic { background-size: cover; }
  .s1 { left: 120px; top: 150px; width: 360px; transform: rotate(-6deg); }
  .s1 .pic { height: 230px; background:linear-gradient(150deg,#6C8AE4 0%,#3D5AC9 100%); position:relative;}
  .s2 { left: 230px; top: 430px; width: 340px; transform: rotate(4deg); }
  .s2 .pic { height: 210px; background:linear-gradient(150deg,#F2A35E,#E07B3E);}
  .s3 { left: 90px; top: 680px; width: 300px; transform: rotate(-3deg); }
  .s3 .pic { height: 180px; background:linear-gradient(150deg,#2EC4A6,#159C82);}
  /* faux UI inside a shot */
  .fnav{position:absolute;top:14px;left:14px;right:14px;height:10px;background:rgba(255,255,255,0.5);border-radius:3px;}
  .fh{position:absolute;top:60px;left:14px;width:60%;height:22px;background:rgba(255,255,255,0.85);border-radius:5px;}
  .fb{position:absolute;top:96px;left:14px;width:42%;height:12px;background:rgba(255,255,255,0.5);border-radius:3px;}
  .fc{position:absolute;bottom:16px;left:14px;width:90px;height:34px;background:#fff;border-radius:7px;}
  /* drag cursor */
  .dragc { position:absolute; z-index:20; left: 470px; top: 360px; filter:drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
  .dragc svg{width:40px;height:40px;}
  .grabchip { position:absolute; z-index:20; left:500px; top:336px; background:#0E0E0E; color:#fff; font-size:14px; font-weight:700; padding:6px 11px; border-radius:8px;}
</style>
</head>
<body>
<div class="stage">
  <!-- chat panel -->
  <div class="chat">
    <div class="ctop">
      <span class="dot r"></span><span class="dot a"></span><span class="dot g"></span>
      <span class="ctitle"><span class="logo-mark">✳</span>Claude Design</span>
    </div>
    <div class="cbody">
      <div class="msg bot">Drop in the screenshots you love and I'll match the vibe.</div>
      <div class="attach-row">
        <div class="mini m1"></div>
        <div class="mini m2"></div>
      </div>
      <div class="msg me">Use these as my references →</div>
    </div>
    <div class="input">
      <div class="ph">Describe the design you want…</div>
      <div class="input-bar">
        <span class="addimg"><b>+</b> Add image</span>
        <span class="send"><svg viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-7-8-3z"/></svg></span>
      </div>
    </div>
    <div class="dropzone"><span class="dz-lab">⤓  Drop screenshots here</span></div>
  </div>

  <!-- floating screenshots being dragged -->
  <div class="shot s1">
    <div class="sbar"><i class="r" style="background:#FF5F57"></i><i class="a" style="background:#FEBC2E"></i><i class="g" style="background:#28C840"></i></div>
    <div class="pic"><div class="fnav"></div><div class="fh"></div><div class="fb"></div><div class="fc"></div></div>
  </div>
  <div class="shot s2">
    <div class="sbar"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i></div>
    <div class="pic"><div class="fnav"></div><div class="fh"></div><div class="fb"></div><div class="fc"></div></div>
  </div>
  <div class="shot s3">
    <div class="sbar"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i></div>
    <div class="pic"><div class="fnav"></div><div class="fh"></div><div class="fb"></div></div>
  </div>

  <div class="grabchip">dragging 2 images</div>
  <div class="dragc">
    <svg viewBox="0 0 24 24"><path d="M3 2l7 18 2.5-7L20 10z" fill="#fff" stroke="#0E0E0E" stroke-width="1.4"/></svg>
  </div>
</div>
</body>
</html>
