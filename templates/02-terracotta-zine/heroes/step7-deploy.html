<!DOCTYPE html>
<!-- Illustrative mock, not a real product screenshot: an optional reference composition for shared/render-heroes.mjs, not used by /carousel. A mock explains; it is never proof. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hero — step7 deploy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1600px; height: 1000px;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    width: 1600px; height: 1000px;
    position: relative;
    background:
      radial-gradient(circle at 50% 18%, rgba(217,119,87,0.13), transparent 50%),
      linear-gradient(155deg, #20140f 0%, #150d09 100%);
    overflow: hidden;
    display:flex; align-items:center; justify-content:center; gap: 70px;
  }
  .card {
    width: 560px; height: 600px;
    background:#F7F4EF; border-radius:24px;
    box-shadow:0 40px 90px rgba(0,0,0,0.5);
    overflow:hidden; position:relative;
    display:flex; flex-direction:column;
  }
  .ctop{height:56px;display:flex;align-items:center;padding:0 22px;gap:11px;}
  .dot{width:16px;height:16px;border-radius:50%;}.r{background:#FF5F57;}.a{background:#FEBC2E;}.g{background:#28C840;}
  /* GitHub card */
  .gh .ctop{background:#22262C;}
  .gh-body{flex:1;background:#0E0E0E;padding:38px 36px;color:#e8e2d6;}
  .gh-head{display:flex;align-items:center;gap:16px;margin-bottom:28px;}
  .octo{width:64px;height:64px;border-radius:50%;background:#fff;position:relative;flex-shrink:0;}
  .octo::before{content:'';position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:42px;height:38px;background:#0E0E0E;border-radius:50% 50% 46% 46%;}
  .octo::after{content:'';position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:20px;height:14px;background:#0E0E0E;border-radius:4px;}
  .gh-name{font-weight:800;font-size:30px;color:#fff;}
  .gh-name span{color:#8a8276;font-weight:600;}
  .repo-meta{display:flex;gap:22px;margin-bottom:30px;font-size:16px;color:#8a8276;font-weight:600;}
  .repo-meta b{color:#e8e2d6;}
  .lang{display:flex;align-items:center;gap:8px;}
  .lang .d{width:12px;height:12px;border-radius:50%;background:#D97757;}
  .commits{display:flex;flex-direction:column;gap:14px;}
  .commit{display:flex;align-items:center;gap:14px;}
  .commit .cd{width:14px;height:14px;border-radius:50%;background:#28C840;flex-shrink:0;}
  .commit .bar{height:12px;border-radius:4px;background:#2a2a2a;}
  .commit .msg{font-family:'JetBrains Mono',monospace;font-size:15px;color:#9a9286;}
  .commit .sha{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:14px;color:#D97757;}
  /* arrow */
  .arrow{display:flex;flex-direction:column;align-items:center;gap:14px;z-index:5;}
  .arrow .line{display:flex;align-items:center;}
  .arrow .line::before{content:'';width:90px;height:5px;border-radius:3px;background:linear-gradient(90deg,#7a4a39,#D97757);}
  .arrow .line::after{content:'';width:0;height:0;border-style:solid;border-width:16px 0 16px 26px;border-color:transparent transparent transparent #D97757;}
  .arrow .lab{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;color:#E89A78;text-align:center;letter-spacing:.02em;}
  /* Vercel card */
  .vc .ctop{background:#E2DBCF;}
  .vc-body{flex:1;background:#fff;padding:38px 36px;color:#0E0E0E;display:flex;flex-direction:column;}
  .vc-head{display:flex;align-items:center;gap:16px;margin-bottom:26px;}
  .vmark{width:0;height:0;border-style:solid;border-width:0 32px 54px 32px;border-color:transparent transparent #0E0E0E transparent;}
  .vc-name{font-weight:900;font-size:30px;color:#0E0E0E;}
  .status{display:flex;align-items:center;gap:11px;background:rgba(40,200,64,0.12);border:1px solid rgba(40,200,64,0.4);border-radius:12px;padding:14px 18px;margin-bottom:22px;}
  .status .sd{width:14px;height:14px;border-radius:50%;background:#28C840;box-shadow:0 0 0 5px rgba(40,200,64,0.2);}
  .status .st{font-weight:800;font-size:20px;color:#1c7a2e;}
  .urlbox{background:#F1ECE3;border-radius:12px;padding:16px 18px;display:flex;align-items:center;gap:12px;margin-bottom:auto;}
  .urlbox .lk{width:14px;height:14px;border-radius:4px;background:#28C840;}
  .urlbox .u{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:#0E0E0E;}
  .urlbox .u b{color:#D97757;}
  .vc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:24px;}
  .vc-foot .meta{font-size:15px;color:#9a8f82;font-weight:600;}
  .vc-foot .meta b{color:#0E0E0E;}
  .visit{background:#0E0E0E;color:#fff;font-weight:700;font-size:16px;padding:12px 20px;border-radius:11px;}
  .tagline{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px;color:#E89A78;letter-spacing:.03em;}
</style>
</head>
<body>
<div class="stage">
  <!-- GitHub -->
  <div class="card gh">
    <div class="ctop"><span class="dot r"></span><span class="dot a"></span><span class="dot g"></span></div>
    <div class="gh-body">
      <div class="gh-head">
        <div class="octo"></div>
        <div class="gh-name"><span>you/</span>award-site</div>
      </div>
      <div class="repo-meta">
        <span class="lang"><span class="d"></span>TypeScript</span>
        <span>★ <b>128</b></span>
        <span>main</span>
      </div>
      <div class="commits">
        <div class="commit"><span class="cd"></span><span class="msg">feat: wire Supabase + cron</span><span class="sha">a1f9c2</span></div>
        <div class="commit"><span class="cd"></span><span class="msg">style: tighten hero spacing</span><span class="sha">7d4e0b</span></div>
        <div class="commit"><span class="cd"></span><span class="msg">init from Claude Design</span><span class="sha">3c08aa</span></div>
      </div>
    </div>
  </div>

  <!-- arrow -->
  <div class="arrow">
    <div class="line"></div>
    <div class="lab">git push<br>→ auto deploy</div>
  </div>

  <!-- Vercel -->
  <div class="card vc">
    <div class="ctop"><span class="dot r"></span><span class="dot a"></span><span class="dot g"></span></div>
    <div class="vc-body">
      <div class="vc-head"><div class="vmark"></div><div class="vc-name">Vercel</div></div>
      <div class="status"><span class="sd"></span><span class="st">Deployment Ready</span></div>
      <div class="urlbox"><span class="lk"></span><span class="u"><b>your-site</b>.vercel.app</span></div>
      <div class="vc-foot">
        <div class="meta">Built in <b>24s</b> · <b>main</b></div>
        <div class="visit">Visit ↗</div>
      </div>
    </div>
  </div>

  <div class="tagline">every push auto-deploys</div>
</div>
</body>
</html>
