<title>Style Library</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a contact-sheet grid of 4:5 slide pairs, one card per style; a detail sheet slides over it. */
:root {
  --bg: #E9ECEE; --surface: #FFFFFF; --frame: #D9DEE2; --ink: #15181C; --muted: #59626C; --line: #CDD3D9;
  --accent: #2B57C9; --accent-ink: #FFFFFF;
  --proven: #B9531D; --ready: #26754A; --blocked: #B3261E; --retired: #737A82;
  --display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --shadow: 0 1px 2px rgba(20,24,28,.06), 0 8px 24px rgba(20,24,28,.07);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101215; --surface: #191C20; --frame: #0A0B0D; --ink: #E8EBEE; --muted: #98A1AB; --line: #2B3036;
  --accent: #86A6FF; --accent-ink: #0D1220;
  --proven: #F08C55; --ready: #5DC38B; --blocked: #FF7B70; --retired: #8E959D;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #101215; --surface: #191C20; --frame: #0A0B0D; --ink: #E8EBEE; --muted: #98A1AB; --line: #2B3036;
  --accent: #86A6FF; --accent-ink: #0D1220;
  --proven: #F08C55; --ready: #5DC38B; --blocked: #FF7B70; --retired: #8E959D;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap { max-width: 1480px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 32px; }
h1 { margin: 0; font: 850 clamp(34px, 6vw, 60px)/0.95 var(--display); font-stretch: 78%; letter-spacing: -0.01em; text-transform: uppercase; }
.lede { margin: 8px 0 0; color: var(--muted); max-width: 62ch; }
.stamp { font: 12px/1.6 var(--mono); color: var(--muted); text-align: right; }

/* filters */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; margin: 22px 0 22px; padding: 10px 0;
  background: var(--bg); display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; border-bottom: 1px solid var(--line); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button, .spine { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px;
  cursor: pointer; font-size: 13.5px; font-weight: 500; white-space: nowrap; }
.seg button[aria-pressed="true"], .spine[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg button .n { font: 12px var(--mono); opacity: .7; margin-left: 4px; }
.spines { display: flex; gap: 6px; align-items: center; }
.spines .lbl, .ctl .lbl { font: 600 11px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.spine { padding: 5px 10px; font-family: var(--mono); }
.ctl { display: flex; gap: 8px; align-items: center; }
select, input[type=search] { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 13.5px; }
input[type=search] { width: 200px; max-width: 100%; }
.count { margin-left: auto; font: 12.5px var(--mono); color: var(--muted); }

/* grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 22px; }
.card { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.frames { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 0; border: 0; background: var(--frame); cursor: zoom-in; width: 100%; }
.frames img, .strip img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: contain; background: var(--frame); }
.frames.single { grid-template-columns: 1fr; }
.frames.single img { aspect-ratio: auto; max-height: 520px; }
.meta { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.idrow { display: flex; align-items: center; gap: 10px; }
.sid { font: 850 26px/1 var(--display); font-stretch: 70%; letter-spacing: .01em; }
.state { font: 600 11px/1 var(--body); letter-spacing: .07em; text-transform: uppercase; padding: 5px 8px; border-radius: 999px; border: 1.5px solid currentColor; }
.state.proven { color: var(--proven); } .state.ready { color: var(--ready); } .state.blocked { color: var(--blocked); } .state.retired { color: var(--retired); }
.cool { font: 11.5px var(--mono); color: var(--muted); margin-left: auto; text-align: right; }
.card h2 { margin: 0; font: 750 21px/1.15 var(--display); font-stretch: 92%; text-wrap: balance; }
.card h2 button { all: unset; cursor: pointer; }
.card h2 button:hover { text-decoration: underline; text-underline-offset: 3px; }
.line { margin: 0; color: var(--muted); font-size: 14px; }
.facts { margin: auto 0 0; padding-top: 8px; border-top: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; min-width: 0; font-variant-numeric: tabular-nums; }
.sw { display: flex; flex-wrap: wrap; gap: 4px; }
.sw i { width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--line); display: block; }
.empty { padding: 60px 0; text-align: center; color: var(--muted); }

/* detail sheet */
dialog { border: 0; padding: 0; width: min(1200px, 100vw); max-width: 100vw; height: 100%; max-height: 100%; margin: 0 0 0 auto;
  background: var(--bg); color: var(--ink); box-shadow: -10px 0 40px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(10,12,15,.55); }
.sheet { height: 100%; overflow-y: auto; overscroll-behavior: contain; }
.sh-head { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  padding-block: calc(14px + env(safe-area-inset-top, 0px)) 14px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.sh-head .sid { font-size: 34px; }
.sh-head h2 { margin: 0; font: 750 24px/1.1 var(--display); font-stretch: 92%; min-width: 0; }
.sh-head .acts { margin-left: auto; display: flex; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 500; font-size: 14px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.sh-body { padding-block: 20px 48px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 26px; }
.strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; }
.strip figure { margin: 0; flex: 0 0 auto; width: min(300px, 72vw); scroll-snap-align: start; }
.strip img { border-radius: 6px; }
.strip figcaption { font: 11.5px var(--mono); color: var(--muted); padding-top: 5px; }
.oneline { margin: 0; font-size: 17px; max-width: 70ch; text-wrap: pretty; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 26px 34px; }
.cols > section { min-width: 0; }
h3 { margin: 0 0 8px; font: 600 11.5px/1 var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 8px 14px; margin: 0; }
.kv dt { color: var(--muted); font-size: 13.5px; }
.kv dd { margin: 0; min-width: 0; }
.prose { margin: 0; max-width: 72ch; }
ul.req { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.tag { display: inline-block; font: 12px var(--mono); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; margin: 0 4px 4px 0; background: var(--surface); }
.ev { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.ev th, .ev td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.ev th { font-weight: 500; color: var(--muted); }
.tablewrap { overflow-x: auto; }
details.prompt summary { cursor: pointer; font-weight: 500; }
details.prompt pre { margin: 10px 0 0; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  font: 12.5px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 70vh; overflow-y: auto; }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 50; }
@media (max-width: 640px) {
  .count { margin-left: 0; }
  .kv { grid-template-columns: 1fr; gap: 2px; }
  .kv dd { margin-bottom: 8px; }
  .sh-head .acts { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: no-preference) {
  .card { transition: transform .15s ease; }
  .card:hover { transform: translateY(-2px); }
}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Style Library</h1>
      <p class="lede">Every style <code>/carousel</code> can make, with a cover and an inside slide from the deck it came from. Pick one for the brief card by its number. Open a card for more slides, the full spec and the prompt block.</p>
    </div>
    <div class="stamp" id="stamp"></div>
  </header>

  <nav class="bar" aria-label="Filters">
    <div class="seg" id="seg" role="group" aria-label="Which styles"></div>
    <div class="spines" role="group" aria-label="Story spine"><span class="lbl">Spine</span><span id="spines" class="spines"></span></div>
    <label class="ctl"><span class="lbl">Made as</span>
      <select id="prod"><option value="">Any</option><option value="html-native">HTML</option><option value="image-native">Image</option><option value="hybrid">Hybrid</option></select></label>
    <input type="search" id="q" placeholder="Search names, palettes, notes" aria-label="Search styles">
    <span class="count" id="count"></span>
  </nav>

  <main class="grid" id="grid"></main>
  <p class="empty" id="empty" hidden>No style matches these filters.</p>
</div>

<dialog id="sheet" aria-labelledby="sh-name"><div class="sheet" id="sheet-body"></div></dialog>

<script>
const DATA = /*__DATA__*/null;
const $ = (s, r = document) => r.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const PROD = { 'html-native': 'HTML', 'image-native': 'Image', hybrid: 'Hybrid' };
const PROD_LONG = { 'html-native': 'HTML (exact text, rendered by template)', 'image-native': 'Image (Codex paints the plate)', hybrid: 'Hybrid (Codex plate + HTML cards composited)' };
const today = new Date();
const iso = (d) => d.toISOString().slice(0, 10);
const mmdd = (d) => d ? d.slice(5).replace('-', '/') : '-';
const days = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const fx = (m) => (m == null ? '-' : `${m.toFixed(2)}×`);

for (const s of DATA.styles) {
  s.group = s.status === 'retired' ? 'retired' : s.stats.uses > 0 ? 'proven' : 'new';
  s.state = s.status === 'retired' ? 'retired' : s.blocked ? 'blocked' : s.group === 'proven' ? 'proven' : 'ready';
  s.hexes = [...new Set((s.attributes?.palette ?? '').match(/#[0-9a-f]{6}\b/gi) ?? [])].slice(0, 8);
  s.hay = [s.id, s.name, s.one_line, s.formats?.notes, ...Object.values(s.attributes ?? {}), s.evidence_note, ...(s.evidence ?? []).map((e) => e.creator)].join(' ').toLowerCase();
  const last = s.stats.last_used;
  s.cooling = last && days(last, iso(today)) < s.cooldown_days ? new Date(Date.parse(last) + s.cooldown_days * 864e5).toISOString().slice(0, 10) : null;
}
const STATE_LABEL = { proven: 'Proven', ready: 'Ready', blocked: 'Blocked', retired: 'Retired' };

function record(s) {
  if (s.group !== 'new' && s.stats.uses) {
    const t = s.stats;
    return `${t.uses} post${t.uses === 1 ? '' : 's'} · typical ${fx(t.median_mult)} · best ${fx(t.best_mult)}`;
  }
  const e = s.evidence?.[0];
  if (!e) return 'No posts yet';
  return `@${esc(e.creator)} · ${esc(e.likes)} likes · ${esc(e.reposts)} reposts`;
}
function lastUsed(s) {
  if (s.cooling) return `cooling until ${mmdd(s.cooling)}`;
  if (s.stats.last_used) return `last ${mmdd(s.stats.last_used)}`;
  return '';
}

// ---- filters ----
const SEGS = [
  ['all', 'All', (s) => s.group !== 'retired'],
  ['proven', 'Proven in feed', (s) => s.group === 'proven'],
  ['new', 'From other accounts', (s) => s.group === 'new'],
  ['ready', 'Ready to make', (s) => s.state === 'ready' || s.state === 'proven'],
  ['blocked', 'Blocked', (s) => s.state === 'blocked'],
  ['retired', 'Retired', (s) => s.group === 'retired'],
];
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const state = { seg: store.get('sl.seg') || 'all', spine: null, prod: '', q: '' };

$('#seg').innerHTML = SEGS.map(([k, label, f]) => `<button type="button" data-seg="${k}" aria-pressed="${state.seg === k}">${label}<span class="n">${DATA.styles.filter(f).length}</span></button>`).join('');
$('#spines').innerHTML = Object.entries(DATA.spines).map(([k, v]) => `<button type="button" class="spine" data-spine="${k}" aria-pressed="false" title="${esc(v)}">${k}</button>`).join('');
$('#stamp').innerHTML = `${DATA.styles.filter((s) => s.group !== 'retired').length} styles · catalog ${esc(DATA.updated)}<br>built ${esc(DATA.built)} from engine/styles/styles.json`;

$('#seg').addEventListener('click', (e) => { const b = e.target.closest('[data-seg]'); if (!b) return; state.seg = b.dataset.seg; store.set('sl.seg', state.seg); render(); });
$('#spines').addEventListener('click', (e) => { const b = e.target.closest('[data-spine]'); if (!b) return; state.spine = state.spine === b.dataset.spine ? null : b.dataset.spine; render(); });
$('#prod').addEventListener('change', (e) => { state.prod = e.target.value; render(); });
$('#q').addEventListener('input', (e) => { state.q = e.target.value.trim().toLowerCase(); render(); });

function card(s) {
  const [a, b] = s.slides;
  const single = !b || s.slides.length === 1;
  const imgs = single ? `<img src="${a.img}" alt="${esc(s.name)} example slide" loading="lazy">`
    : `<img src="${a.img}" alt="${esc(s.name)} cover" loading="lazy"><img src="${b.img}" alt="${esc(s.name)} inside slide" loading="lazy">`;
  return `<article class="card" data-id="${s.id}">
    <button class="frames${single ? ' single' : ''}" type="button" data-open="${s.id}" aria-label="Open ${s.id} ${esc(s.name)}">${a ? imgs : ''}</button>
    <div class="meta">
      <div class="idrow"><span class="sid">${s.id}</span><span class="state ${s.state}">${STATE_LABEL[s.state]}</span><span class="cool">${lastUsed(s)}</span></div>
      <h2><button type="button" data-open="${s.id}">${esc(s.name)}</button></h2>
      <p class="line">${esc(s.one_line)}</p>
      <dl class="facts">
        <dt>Record</dt><dd>${record(s)}</dd>
        <dt>Made as</dt><dd>${PROD[s.production]} · spine ${(s.formats?.spines ?? []).join(', ') || '-'}</dd>
        ${s.hexes.length ? `<dt>Palette</dt><dd class="sw">${s.hexes.map((h) => `<i style="background:${h}" title="${h}"></i>`).join('')}</dd>` : ''}
      </dl>
    </div>
  </article>`;
}

function render() {
  for (const b of document.querySelectorAll('[data-seg]')) b.setAttribute('aria-pressed', String(b.dataset.seg === state.seg));
  for (const b of document.querySelectorAll('[data-spine]')) b.setAttribute('aria-pressed', String(b.dataset.spine === state.spine));
  const f = SEGS.find((x) => x[0] === state.seg)?.[2] ?? SEGS[0][2];
  const list = DATA.styles.filter((s) => f(s)
    && (!state.spine || (s.formats?.spines ?? []).includes(state.spine))
    && (!state.prod || s.production === state.prod)
    && (!state.q || s.hay.includes(state.q)));
  $('#grid').innerHTML = list.map(card).join('');
  $('#empty').hidden = list.length > 0;
  $('#count').textContent = `${list.length} shown`;
}

// ---- detail sheet ----
const ROLE = { cover: 'Cover', interior: 'Inside', more: 'Slide' };
function slideCaption(s, x, i) {
  if (x.role === 'interior' && s.exemplars.interior_slide) return `Inside · slide ${s.exemplars.interior_slide}`;
  return x.role === 'more' ? `Slide ${i + 1}` : ROLE[x.role];
}
function detail(s) {
  const t = s.stats;
  const attrs = [['Ground', 'ground'], ['Type', 'type_pairing'], ['Panels', 'panel'], ['Character', 'character'], ['Ornament', 'ornament'], ['Palette', 'palette']]
    .filter(([, k]) => s.attributes?.[k]).map(([l, k]) => `<dt>${l}</dt><dd>${esc(s.attributes[k])}</dd>`).join('');
  const spines = (s.formats?.spines ?? []).map((k) => `<span class="tag">${k} · ${esc(DATA.spines[k] ?? '')}</span>`).join('');
  const recordBlock = s.stats.uses ? `
      <dl class="kv">
        <dt>Posts</dt><dd>${t.uses} as cover${t.interior_uses ? `, ${t.interior_uses} as inside slides` : ''}</dd>
        <dt>Typical</dt><dd>${fx(t.median_mult)} <span style="color:var(--muted)">(views vs. your carousels that month)</span></dd>
        <dt>Best</dt><dd>${fx(t.best_mult)}${t.best_code ? ` · <a href="https://www.instagram.com/p/${esc(t.best_code)}/" target="_blank" rel="noopener">${esc(t.best_code)}</a>` : ''}</dd>
        <dt>Last used</dt><dd>${esc(t.last_used ?? '-')}${s.cooling ? ` · cooling until ${esc(s.cooling)}` : ` · cooldown ${s.cooldown_days} days`}</dd>
        ${s.drafts?.length ? `<dt>Drafts</dt><dd>${s.drafts.map((d) => `<span class="tag">${esc(d.folder)}</span>`).join('')}</dd>` : ''}
      </dl>` : `
      <div class="tablewrap"><table class="ev"><thead><tr><th>Post</th><th>Creator</th><th>Likes</th><th>Comments</th><th>Reposts</th><th>Seen</th></tr></thead><tbody>
        ${(s.evidence ?? []).map((e) => `<tr><td><a href="https://www.instagram.com/p/${esc(e.code)}/" target="_blank" rel="noopener">${esc(e.code)}</a></td><td>@${esc(e.creator)}</td><td>${esc(e.likes)}</td><td>${esc(e.comments)}</td><td>${esc(e.reposts)}</td><td>${esc(e.observed)}</td></tr>`).join('')}
      </tbody></table></div>`;
  return `
    <div class="sh-head">
      <span class="sid">${s.id}</span>
      <h2 id="sh-name">${esc(s.name)}</h2>
      <span class="state ${s.state}">${STATE_LABEL[s.state]}</span>
      <div class="acts">
        <button class="btn primary" type="button" id="copy">Copy pick</button>
        <button class="btn" type="button" id="close">Close</button>
      </div>
    </div>
    <div class="sh-body">
      <div class="strip">${s.slides.map((x, i) => `<figure><img src="${x.img}" alt="${esc(s.name)} ${esc(slideCaption(s, x, i))}" loading="lazy"><figcaption>${esc(slideCaption(s, x, i))}</figcaption></figure>`).join('')}</div>
      <p class="oneline">${esc(s.one_line)}</p>
      <div class="cols">
        <section><h3>Use it for</h3>
          <div>${spines}<span class="tag">${PROD_LONG[s.production]}</span></div>
          <p class="prose">${esc(s.formats?.notes)}</p></section>
        <section><h3>${s.stats.uses ? 'Record in your feed' : 'Reference performance'}</h3>${recordBlock}
          <p class="prose" style="margin-top:10px">${esc(s.evidence_note)}</p></section>
        <section><h3>Look</h3><dl class="kv">${attrs}</dl>
          ${s.hexes.length ? `<div class="sw" style="margin-top:10px">${s.hexes.map((h) => `<i style="background:${h};width:28px;height:28px" title="${h}"></i>`).join('')}</div>` : ''}</section>
        <section><h3>Needs</h3>
          <ul class="req">${(s.requires ?? []).map((r) => `<li>${esc(r)}</li>`).join('')}</ul>
          ${s.template ? `<p class="prose" style="margin-top:10px">Template: <span class="tag">${esc(s.template)}</span></p>` : ''}
          ${s.cooldown_group ? `<p class="prose" style="margin-top:6px">Shares a ${s.cooldown_group.cap_days}-day cover cooldown with ${s.cooldown_group.members.filter((m) => m !== s.id).join(', ')}.</p>` : ''}</section>
        <section><h3>Where the examples come from</h3><p class="prose">${esc(s.exemplars?.note)}</p></section>
      </div>
      ${s.prompt ? `<details class="prompt"><summary>Prompt block · ${esc(s.prompt.file)}</summary><pre>${esc(s.prompt.text)}</pre></details>` : ''}
    </div>`;
}

const dlg = $('#sheet');
function open(id, push = true) {
  const s = DATA.styles.find((x) => x.id === id);
  if (!s) return;
  $('#sheet-body').innerHTML = detail(s);
  $('#sheet-body').scrollTop = 0;
  $('#close').onclick = () => dlg.close();
  $('#copy').onclick = async (e) => {
    const text = `Use style ${s.id} ${s.name}`;
    try { await navigator.clipboard.writeText(text); toast(`Copied "${text}"`); }
    catch { toast(`Copy didn't work here. Type: ${s.id}`); }
  };
  if (!dlg.open) dlg.showModal();
  if (push) try { history.replaceState(null, '', `#${id}`); } catch {}
}
dlg.addEventListener('close', () => { try { history.replaceState(null, '', location.pathname + location.search); } catch {} });
dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
document.addEventListener('click', (e) => { const b = e.target.closest('[data-open]'); if (b) open(b.dataset.open); });

let toastT;
function toast(msg) {
  let el = $('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.append(el); }
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2200);
}

render();
const hash = location.hash.slice(1).toUpperCase();
if (/^(S\d+|R\d+)$/.test(hash)) open(hash, false);
</script>
